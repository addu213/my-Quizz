<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivia Blitz</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .hidden { display: none !important; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; text-align: center; }
        h1, h2, h3 { margin-bottom: 15px; color: #60a5fa; }
        p { margin-bottom: 15px; line-height: 1.5; }
        button { background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        button:hover:not(:disabled) { background: #2563eb; transform: translateY(-2px); }
        button:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }
        .btn-green { background: #10b981; } .btn-green:hover:not(:disabled) { background: #059669; }
        .btn-orange { background: #f59e0b; } .btn-orange:hover:not(:disabled) { background: #d97706; }
        input, textarea { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-bottom: 15px; font-size: 16px; outline: none; }
        input:focus, textarea:focus { border-color: #3b82f6; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .leaderboard { background: #0f172a; padding: 15px; border-radius: 10px; text-align: left; margin-top: 20px; border: 1px solid #334155; max-height: 200px; overflow-y: auto; }
        .leaderboard li { padding: 8px 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; font-weight: bold; }
        .leaderboard li:last-child { border-bottom: none; }
        .score-text { font-size: 24px; color: #10b981; font-weight: bold; margin: 15px 0; }
        .qr-box { background: white; padding: 10px; display: inline-block; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<!-- ================= TEACHER ================= -->
<div id="teacherUI" class="card hidden">
    <h1>Teacher Board</h1>
    <div class="qr-box"><div id="qrcode"></div></div>
    <p>Room: <strong id="roomCode" style="color:#10b981; font-size:20px;"></strong></p>

    <div id="setupArea">
        <textarea id="jsonInput" rows="6" placeholder='[{"q":"Capital of France?","a":"Berlin","b":"Madrid","c":"Paris","d":"Rome","ans":"c"}]'></textarea>
        <button class="btn-green" onclick="loadQuestions()">Load Questions</button>
    </div>

    <div id="gameArea" class="hidden">
        <h3>Question <span id="qIndex">1</span></h3>
        <p id="qText" style="font-size: 20px; font-weight: bold; color: #fbbf24;"></p>
        <p style="font-size: 14px; color:#94a3b8;">Answer: <span id="qAns" style="color:#10b981; font-weight:bold;"></span></p>
        
        <button id="btnBroadcast" onclick="broadcastQuestion()">Broadcast Question</button>
        <button id="btnReveal" class="btn-orange" onclick="revealAnswer()" disabled>Reveal Answer</button>
        <button id="btnNext" class="btn-green" onclick="nextQuestion()" disabled>Next Question</button>
        
        <div class="leaderboard">
            <h3 style="margin-bottom:10px; font-size:16px;">Top 10 Players</h3>
            <ol id="teacherBoard" style="list-style:none;"></ol>
        </div>
    </div>
</div>

<!-- ================= STUDENT ================= -->
<div id="studentUI" class="card hidden">
    <div id="joinArea">
        <h1>Join Trivia</h1>
        <input id="nickname" placeholder="Enter your name" autocomplete="off">
        <button onclick="joinGame()">JOIN GAME</button>
    </div>

    <div id="waitArea" class="hidden">
        <h2>Welcome, <span id="studentName" style="color:#fbbf24;"></span></h2>
        <p>Waiting for the teacher to start...</p>
        <div class="score-text">Total Score: <span id="totalScore">0</span></div>
    </div>

    <div id="questionArea" class="hidden">
        <h2 id="s_qText" style="font-size:22px; margin-bottom:20px; color:white;"></h2>
        <div class="grid">
            <button class="btn-opt" onclick="submitAnswer('a')" id="btnA">A</button>
            <button class="btn-opt" onclick="submitAnswer('b')" id="btnB">B</button>
            <button class="btn-opt" onclick="submitAnswer('c')" id="btnC">C</button>
            <button class="btn-opt" onclick="submitAnswer('d')" id="btnD">D</button>
        </div>
        <p id="s_status" style="color: #fbbf24; font-weight: bold; margin-top:15px;"></p>
    </div>

    <div id="resultArea" class="hidden">
        <h2 id="r_result" style="font-size: 32px;"></h2>
        <p id="r_points" style="font-size: 18px; color:#94a3b8;"></p>
        <div class="score-text">Total Score: <span id="r_total">0</span></div>
        <p style="color:#94a3b8; margin-top:20px;">Waiting for the next question...</p>
    </div>
</div>

<script>
    const ABLY_KEY = 'LkHPHw.rwxAzw:d0AITZxyyJbZZQx0nxa3HXdOxK0_D1lYDgJN24dEn-U';
    let ably, channel, roomId;
    let isTeacher = false;

    // Teacher State
    let questions = [], currentQ = -1, players = {}, currentAns = '';

    // Student State
    let myName = '', myTotalScore = 0, startTime = 0, myChoice = null;

    window.onload = () => {
        const params = new URLSearchParams(window.location.hash.substring(1));
        roomId = params.get('room') || 'TRIVIA101';

        if (params.get('role') === 'teacher') {
            isTeacher = true;
            document.getElementById('teacherUI').classList.remove('hidden');
            document.getElementById('roomCode').innerText = roomId;
            
            const joinUrl = `${window.location.origin}${window.location.pathname}#role=student&room=${roomId}`;
            new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 150, height: 150 });
            
            connectAbly('teacher');
        } else {
            document.getElementById('studentUI').classList.remove('hidden');
        }
    };

    function connectAbly(clientId) {
        ably = new Ably.Realtime({ key: ABLY_KEY, clientId: clientId });
        channel = ably.channels.get(`room_${roomId}`);

        channel.subscribe('submit_answer', (msg) => {
            if (!isTeacher) return;
            const { name, choice, timeTaken } = msg.data;
            if (choice === currentAns) {
                let pts = 100;
                if (timeTaken > 10) pts = Math.max(50, 100 - ((timeTaken - 10) * 5));
                players[name] = (players[name] || 0) + pts;
                updateBoard();
            }
        });
    }

    // === TEACHER ===
    function loadQuestions() {
        try {
            questions = JSON.parse(document.getElementById('jsonInput').value);
            if (questions.length === 0) throw "Empty";
            document.getElementById('setupArea').classList.add('hidden');
            document.getElementById('gameArea').classList.remove('hidden');
            currentQ = -1; nextQuestion();
        } catch (e) { alert("Invalid JSON format."); }
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ >= questions.length) return alert("End of deck!");
        const q = questions[currentQ];
        currentAns = q.ans;
        document.getElementById('qIndex').innerText = currentQ + 1;
        document.getElementById('qText').innerText = q.q;
        document.getElementById('qAns').innerText = currentAns.toUpperCase();
        
        document.getElementById('btnBroadcast').disabled = false;
        document.getElementById('btnReveal').disabled = true;
        document.getElementById('btnNext').disabled = true;
    }

    function broadcastQuestion() {
        const q = questions[currentQ];
        document.getElementById('btnBroadcast').disabled = true;
        document.getElementById('btnReveal').disabled = false;
        channel.publish('show_question', { text: q.q, a: q.a, b: q.b, c: q.c, d: q.d });
    }

    function revealAnswer() {
        document.getElementById('btnReveal').disabled = true;
        document.getElementById('btnNext').disabled = false;
        channel.publish('reveal_answer', { ans: currentAns });
    }

    function updateBoard() {
        const sorted = Object.entries(players).sort((a, b) => b[1] - a[1]).slice(0, 10);
        document.getElementById('teacherBoard').innerHTML = sorted.map(p => `<li><span>${p[0]}</span> <span style="color:#10b981;">${p[1]} pts</span></li>`).join('');
    }

    // === STUDENT ===
    function joinGame() {
        myName = document.getElementById('nickname').value.trim();
        if (!myName) return alert("Enter a name");
        document.getElementById('joinArea').classList.add('hidden');
        document.getElementById('waitArea').classList.remove('hidden');
        document.getElementById('studentName').innerText = myName;
        
        connectAbly(myName);
        
        channel.subscribe('show_question', (msg) => {
            const q = msg.data;
            document.getElementById('waitArea').classList.add('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('questionArea').classList.remove('hidden');
            
            document.getElementById('s_qText').innerText = q.text;
            document.getElementById('btnA').innerText = "A) " + q.a;
            document.getElementById('btnB').innerText = "B) " + q.b;
            document.getElementById('btnC').innerText = "C) " + q.c;
            document.getElementById('btnD').innerText = "D) " + q.d;
            
            document.querySelectorAll('.btn-opt').forEach(b => { b.disabled = false; b.style.background = '#3b82f6'; });
            document.getElementById('s_status').innerText = "";
            myChoice = null;
            startTime = Date.now();
        });

        channel.subscribe('reveal_answer', (msg) => {
            const correctAns = msg.data.ans;
            document.getElementById('questionArea').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');
            
            const rResult = document.getElementById('r_result');
            const rPoints = document.getElementById('r_points');

            if (myChoice === null) {
                rResult.innerText = "Too slow!"; rResult.style.color = "#ef4444";
                rPoints.innerText = "You didn't answer.";
            } else if (myChoice === correctAns) {
                rResult.innerText = "Correct!"; rResult.style.color = "#10b981";
                // Calculate actual points based on time
                const timeTaken = (Date.now() - startTime) / 1000; 
                // Note: using click time is better, but for simplicity we calculate on reveal
                // (In a real app, you'd store the timeTaken when they clicked)
                let pts = 100;
                if (timeTaken > 10) pts = Math.max(50, 100 - ((timeTaken - 10) * 5));
                myTotalScore += pts;
                rPoints.innerText = `+${pts} points`;
            } else {
                rResult.innerText = "Wrong!"; rResult.style.color = "#ef4444";
                rPoints.innerText = "0 points";
            }
            document.getElementById('r_total').innerText = myTotalScore;
        });
    }

    function submitAnswer(choice) {
        if (myChoice !== null) return;
        myChoice = choice;
        
        document.querySelectorAll('.btn-opt').forEach(b => { b.disabled = true; b.style.background = '#475569'; });
        document.getElementById('s_status').innerText = "Answer locked in!";
        
        const timeTaken = (Date.now() - startTime) / 1000;
        
        channel.publish('submit_answer', { name: myName, choice: choice, timeTaken: timeTaken });
    }
</script>
</body>
</html>
