    let ably = null, channel = null, currentRoomId = '';
    let myPlayer = null, teacherPlayers = new Map();
    let currentQuestion = null, questionActive = false, roundDuration = 20, timerInterval = null, questionIndex = 0;
    let loadedDeck = [], deckIndex = -1, studentAnswerLocked = false, currentStudentQuestion = null, qrScannerInstance = null;

    class PlayerProfile { constructor(n, a) { this.nickname = n; this.avatar = a; this.score = 0; this.infractions = 0; } }

    window.addEventListener('load', () => {
        const params = new URLSearchParams(window.location.hash.substring(1));
        if (params.get('role') === 'teacher') {
            currentRoomId = params.get('room') || 'QUIZ' + Math.floor(1000 + Math.random() * 9000);
            initTeacher();
        } else {
            currentRoomId = params.get('room') || '';
            initStudent();
        }
    });

    function initTeacher() {
        document.getElementById('teacherApp').classList.remove('hidden');
        document.getElementById('roomBadge').innerText = `ROOM: ${currentRoomId}`;
        const joinLink = `${window.location.origin}${window.location.pathname}#role=student&room=${currentRoomId}`;
        new QRCode(document.getElementById("qrcodeContainer"), { text: joinLink, width: 180, height: 180 });

        const savedDeckJSON = localStorage.getItem('trivia_deck_json');
        if (savedDeckJSON) {
            document.getElementById('jsonInput').value = savedDeckJSON;
            if (localStorage.getItem('trivia_deck_name')) document.getElementById('deckNameInput').value = localStorage.getItem('trivia_deck_name');
            try {
                loadedDeck = JSON.parse(savedDeckJSON);
                document.getElementById('deckStatus').innerText = `Auto-loaded: ${loadedDeck.length} qs.`;
                document.getElementById('deckStatus').className = "text-xs text-center mt-2 text-emerald-400 font-bold";
            } catch(e) {}
        }

        ably = new Ably.Realtime({ key: ABLY_API_KEY, clientId: 'teacher' });
        channel = ably.channels.get(`room_${currentRoomId}`);

        ably.connection.on('connected', () => {
            channel.subscribe('player_join', (msg) => {
                const { nickname, avatar } = msg.data;
                if (teacherPlayers.size >= 200) return channel.publish('join_ack', { nickname, success: false, reason: 'Room full' });
                if (teacherPlayers.has(nickname)) return channel.publish('join_ack', { nickname, success: false, reason: 'Name taken' });
                teacherPlayers.set(nickname, new PlayerProfile(nickname, avatar));
                channel.publish('join_ack', { nickname, success: true });
                updateTeacherUI();
            });

            channel.subscribe('submission', (msg) => {
                const { nickname, choice, timeElapsed, qIndex } = msg.data;
                if (!questionActive || qIndex !== questionIndex) return;
                const player = teacherPlayers.get(nickname);
                if (!player) return;
                let points = 0;
                if (choice === currentQuestion.correct) {
                    points = (timeElapsed <= 10) ? currentQuestion.baseMarks : Math.round(currentQuestion.baseMarks * (1 - 0.5 * Math.min((timeElapsed - 10) / Math.max(1, roundDuration - 10), 1)));
                } else {
                    points = -Math.abs(currentQuestion.penalty);
                }
                player.score += points;
                channel.publish('score_update', { nickname, newScore: player.score });
                updateTeacherUI();
            });

            channel.subscribe('cheat_flag', (msg) => {
                const player = teacherPlayers.get(msg.data.nickname);
                if (player) { player.infractions++; player.score -= 25; channel.publish('score_update', { nickname: player.nickname, newScore: player.score }); updateTeacherUI(); }
            });
        });

        document.getElementById('saveDeckBtn').onclick = () => {
            try {
                const raw = document.getElementById('jsonInput').value;
                loadedDeck = JSON.parse(raw);
                if (!Array.isArray(loadedDeck) || loadedDeck.length === 0) throw new Error();
                deckIndex = -1;
                localStorage.setItem('trivia_deck_json', raw);
                localStorage.setItem('trivia_deck_name', document.getElementById('deckNameInput').value || 'Unnamed');
                document.getElementById('deckStatus').innerText = `Saved: ${loadedDeck.length} qs.`;
                document.getElementById('deckStatus').className = "text-xs text-center mt-2 text-emerald-400 font-bold";
                alert(`Deck saved!`);
            } catch (e) { alert("Invalid JSON format."); }
        };

        document.getElementById('resultsSetupBtn').onclick = () => {
            document.getElementById('resultsView').classList.add('hidden');
            document.getElementById('resultsView').classList.remove('flex');
            document.getElementById('setupView').classList.remove('hidden');
            document.getElementById('setupView').classList.add('grid');
        };

        document.getElementById('resultsNextBtn').onclick = () => {
            document.getElementById('resultsSetupBtn').click();
            document.getElementById('loadNextBtn').click();
            document.getElementById('broadcastBtn').click();
        };

        document.getElementById('loadNextBtn').onclick = () => {
            deckIndex++;
            if (deckIndex >= loadedDeck.length) return alert("End of deck!");
            const q = loadedDeck[deckIndex];
            document.getElementById('questionText').value = q.q || "";
            document.getElementById('choiceA').value = q.a || "";
            document.getElementById('choiceB').value = q.b || "";
            document.getElementById('choiceC').value = q.c || "";
            document.getElementById('choiceD').value = q.d || "";
            document.getElementById('correctChoiceSelect').value = q.correct || "A";
            document.getElementById('durationInput').value = q.time || 20;
            document.getElementById('baseMarksInput').value = q.base || 100;
            document.getElementById('penaltyInput').value = q.pen || 50;
            document.getElementById('loadNextBtn').innerText = `Next Q (${deckIndex + 1}/${loadedDeck.length}) ▶`;
        };

        document.getElementById('skipTimerBtn').onclick = () => {
            if (timerInterval) clearInterval(timerInterval);
            endRoundAndShowLeaderboard();
        };

        document.getElementById('broadcastBtn').onclick = () => {
            currentQuestion = {
                text: document.getElementById('questionText').value,
                A: document.getElementById('choiceA').value,
                B: document.getElementById('choiceB').value,
                C: document.getElementById('choiceC').value,
                D: document.getElementById('choiceD').value,
                correct: document.getElementById('correctChoiceSelect').value,
                baseMarks: parseInt(document.getElementById('baseMarksInput').value),
                penalty: parseInt(document.getElementById('penaltyInput').value)
            };
            roundDuration = parseInt(document.getElementById('durationInput').value);
            questionIndex++; questionActive = true;

            document.getElementById('projQNum').innerText = questionIndex;
            document.getElementById('projQText').innerText = currentQuestion.text;
            document.getElementById('projOptA').innerText = currentQuestion.A;
            document.getElementById('projOptB').innerText = currentQuestion.B;
            document.getElementById('projOptC').innerText = currentQuestion.C;
            document.getElementById('projOptD').innerText = currentQuestion.D;
            
            ['A','B','C','D'].forEach(opt => document.getElementById(`projBox${opt}`).classList.remove('correct-glow'));

            document.getElementById('setupView').classList.add('hidden');
            document.getElementById('projectorView').classList.remove('hidden');
            document.getElementById('projectorView').classList.add('flex');
            
            channel.publish('question_start', { index: questionIndex, text: currentQuestion.text, duration: roundDuration, choices: { A: currentQuestion.A, B: currentQuestion.B, C: currentQuestion.C, D: currentQuestion.D } });

            let timeLeft = roundDuration;
            document.getElementById('projClock').innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--; 
                document.getElementById('projClock').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endRoundAndShowLeaderboard();
                }
            }, 1000);
        };

        function endRoundAndShowLeaderboard() {
            questionActive = false;
            channel.publish('question_close', {});
            
            const colors = { A: 'projBoxA', B: 'projBoxB', C: 'projBoxC', D: 'projBoxD' };
            const target = document.getElementById(colors[currentQuestion.correct]);
            if (target) target.classList.add('correct-glow');
            
            setTimeout(() => {
                document.getElementById('projectorView').classList.add('hidden');
                document.getElementById('projectorView').classList.remove('flex');
                document.getElementById('resultsView').classList.remove('hidden');
                document.getElementById('resultsView').classList.add('flex');
                buildTop10();
            }, 2500);
        }
    }

    function buildTop10() {
        const sorted = Array.from(teacherPlayers.values()).sort((a, b) => b.score - a.score).slice(0, 10);
        const list = document.getElementById('top10List');
        if (sorted.length === 0) return list.innerHTML = '<div class="text-center text-slate-500 text-2xl">No players yet</div>';
        
        list.innerHTML = sorted.map((p, i) => {
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
            return `
            <div class="flex justify-between items-center bg-slate-800 border-l-8 ${i===0?'border-amber-400':i===1?'border-slate-300':i===2?'border-amber-700':'border-slate-700'} px-6 py-4 rounded-xl shadow-lg">
                <div class="flex items-center gap-4">
                    <span class="text-3xl w-12 text-center">${medal}</span>
                    <span class="text-4xl">${p.avatar}</span>
                    <span class="text-2xl font-bold text-slate-200">${p.nickname}</span>
                </div>
                <span class="text-3xl font-mono font-black text-emerald-400">${p.score}</span>
            </div>`;
        }).join('');
    }

    function updateTeacherUI() {
        document.getElementById('playerCount').innerText = `👥 ${teacherPlayers.size} / 200`;
    }

    function initStudent() {
        document.getElementById('studentApp').classList.remove('hidden');
        const emojis = ['🦊','🐻','🐼','🐨','🦁','🐯','🐸','🐵','🐧','🐦','🐤','🐴','🦄','🐋','🐬','🐟','🐠','🦋','🐝','🐞','🦉','🦅','🦆','🦇','🐺','🐗','🐴','🦓','🦒','🐘','🦏','🐊','🐢','🦎','🐍','🦖','🦕','🐙','🦑','🦐','🦞','🦀','🐡','🐳','🦈','🐆','🐅','🐃','🐂','🐄','🐎','🐖','🐏','🐑','🦙','🐐','🦌','🐕','🐩','🦮','🐈','🐓','🦃','🦚','🦜','🦢','🦩','🕊️','🐇','🦝','🦨','🦡','🦦','🦥','🐁','🐀','🐿️','🦔','🐾','🐉','🐲','🌵','🎄','🌲','🌳','🌴','🌱','🌿','☘️','🍀','🎍','🎋','🍃','🍂','🍁','🍄','🌾','💐','🌷','🌹','🌺','🌸'];
        const grid = document.getElementById('avatarGrid');
        grid.innerHTML = emojis.map((e, i) => `<div class="avatar-option ${i===0?'selected':''}" data-val="${e}">${e}</div>`).join('');
        grid.querySelectorAll('.avatar-option').forEach(el => {
            el.onclick = () => { grid.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); };
        });

        document.getElementById('joinLobbyBtn').onclick = () => {
            const nickname = document.getElementById('nicknameInput').value.trim();
            const avatar = grid.querySelector('.selected').dataset.val;
            if (!nickname) return alert('Enter a nickname');
            if (!currentRoomId) return alert('No Room ID found. Scan QR.');
            myPlayer = new PlayerProfile(nickname, avatar);
            document.getElementById('studentAvatarDisplay').innerText = avatar;
            document.getElementById('studentNickname').innerText = nickname;
            document.getElementById('joinLobbyBtn').innerText = 'Connecting...';
            connectStudentToAbly(nickname, avatar);
        };

        document.getElementById('scanQrBtn').onclick = async () => {
            const container = document.getElementById('qrScannerContainer');
            container.classList.remove('hidden');
            if (!qrScannerInstance) qrScannerInstance = new Html5Qrcode("qrScannerContainer");
            try {
                await qrScannerInstance.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => {
                    const match = decodedText.match(/room=([A-Z0-9]+)/);
                    if (match && match[1]) {
                        currentRoomId = match[1]; qrScannerInstance.stop(); container.classList.add('hidden');
                        document.getElementById('nicknameInput').focus();
                        alert(`Connected to Room ${currentRoomId}!`);
                    }
                });
            } catch (err) { container.classList.add('hidden'); alert("Camera denied."); }
        };

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && myPlayer && !studentAnswerLocked) {
                if (channel) channel.publish('cheat_flag', { nickname: myPlayer.nickname });
                document.getElementById('lockoutOverlay').classList.remove('hidden');
            }
        });
        document.getElementById('dismissLockoutBtn').onclick = () => document.getElementById('lockoutOverlay').classList.add('hidden');
    }

    function connectStudentToAbly(nickname, avatar) {
        ably = new Ably.Realtime({ key: ABLY_API_KEY, clientId: nickname });
        channel = ably.channels.get(`room_${currentRoomId}`);

        ably.connection.on('connected', () => {
            document.getElementById('connectionStatus').innerText = '● Connected';
            document.getElementById('connectionStatus').className = 'text-xs bg-emerald-900 text-emerald-300 px-3 py-1 rounded-full border border-emerald-700';
            channel.publish('player_join', { nickname, avatar });
        });

        channel.subscribe('join_ack', (msg) => {
            if (msg.data.nickname === nickname) {
                if (msg.data.success) {
                    document.getElementById('lobbyView').classList.add('hidden');
                    document.getElementById('frozenView').classList.remove('hidden');
                    document.getElementById('frozenMessage').innerText = "Waiting for teacher...";
                } else {
                    alert('Failed: ' + msg.data.reason);
                    document.getElementById('joinLobbyBtn').innerText = 'JOIN GAME';
                }
            }
        });

        channel.subscribe('question_start', (msg) => {
            currentStudentQuestion = msg.data;
            document.getElementById('frozenView').classList.add('hidden');
            document.getElementById('lobbyView').classList.add('hidden');
            document.getElementById('gamepadView').classList.remove('hidden');
            document.getElementById('gamepadQuestionText').innerText = msg.data.text;
            studentAnswerLocked = false;
            document.getElementById('gamepadStatusText').innerText = "Tap an answer to submit";
            document.querySelectorAll('.choice-btn').forEach(btn => { btn.classList.remove('frozen'); btn.disabled = false; });
            currentStudentQuestion.localStartTime = Date.now();
        });

        channel.subscribe('question_close', () => {
            document.getElementById('gamepadView').classList.add('hidden');
            document.getElementById('frozenView').classList.remove('hidden');
            document.getElementById('frozenMessage').innerText = "Wait for the leaderboard...";
            studentAnswerLocked = true;
        });

        channel.subscribe('reveal_answer', (msg) => {
            document.getElementById('frozenMessage').innerText = `Correct Answer: ${msg.data.correct}`;
        });

        channel.subscribe('score_update', (msg) => {
            if (msg.data.nickname === myPlayer.nickname) {
                myPlayer.score = msg.data.newScore;
                document.getElementById('studentScore').innerText = myPlayer.score;
            }
        });

        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.onclick = () => {
                if (studentAnswerLocked || !currentStudentQuestion) return;
                const choice = btn.dataset.choice;
                const timeElapsed = (Date.now() - currentStudentQuestion.localStartTime) / 1000;
                studentAnswerLocked = true;
                document.querySelectorAll('.choice-btn').forEach(b => { b.classList.add('frozen'); b.disabled = true; });
                document.getElementById('gamepadStatusText').innerText = "Answer locked!";
                channel.publish('submission', { nickname: myPlayer.nickname, choice, timeElapsed, qIndex: currentStudentQuestion.index });
            };
        });
    }
</script>

        document.getElementById('playerCount').innerText = `👥 ${teacherPlayers.size} / 200`;
    }

    function initStudent() {
        document.getElementById('studentApp').classList.remove('hidden');
        const emojis = ['🦊','🐻','🐼','🐨','🦁','🐯','🐸','🐵','🐧','🐦','🐤','🐴','🦄','🐋','🐬','🐟','🐠','🦋','🐝','🐞','🦉','🦅','🦆','🦇','🐺','🐗','🐴','🦓','🦒','🐘','🦏','🐊','🐢','🦎','🐍','🦖','🦕','🐙','🦑','🦐','🦞','🦀','🐡','🐳','🦈','🐆','🐅','🐃','🐂','🐄','🐎','🐖','🐏','🐑','🦙','🐐','🦌','🐕','🐩','🦮','🐈','🐓','🦃','🦚','🦜','🦢','🦩','🕊️','🐇','🦝','🦨','🦡','🦦','🦥','🐁','🐀','🐿️','🦔','🐾','🐉','🐲','🌵','🎄','🌲','🌳','🌴','🌱','🌿','☘️','🍀','🎍','🎋','🍃','🍂','🍁','🍄','🌾','💐','🌷','🌹','🌺','🌸'];
        const grid = document.getElementById('avatarGrid');
        grid.innerHTML = emojis.map((e, i) => `<div class="avatar-option ${i===0?'selected':''}" data-val="${e}">${e}</div>`).join('');
        grid.querySelectorAll('.avatar-option').forEach(el => {
            el.onclick = () => { grid.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); };
        });

        document.getElementById('joinLobbyBtn').onclick = () => {
            const nickname = document.getElementById('nicknameInput').value.trim();
            const avatar = grid.querySelector('.selected').dataset.val;
            if (!nickname) return alert('Enter a nickname');
            if (!currentRoomId) return alert('No Room ID found. Scan QR.');
            myPlayer = new PlayerProfile(nickname, avatar);
            document.getElementById('studentAvatarDisplay').innerText = avatar;
            document.getElementById('studentNickname').innerText = nickname;
            document.getElementById('joinLobbyBtn').innerText = 'Connecting...';
            connectStudentToAbly(nickname, avatar);
        };

        document.getElementById('scanQrBtn').onclick = async () => {
            const container = document.getElementById('qrScannerContainer');
            container.classList.remove('hidden');
            if (!qrScannerInstance) qrScannerInstance = new Html5Qrcode("qrScannerContainer");
            try {
                await qrScannerInstance.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => {
                    const match = decodedText.match(/room=([A-Z0-9]+)/);
                    if (match && match[1]) {
                        currentRoomId = match[1]; qrScannerInstance.stop(); container.classList.add('hidden');
                        document.getElementById('nicknameInput').focus();
                        alert(`Connected to Room ${currentRoomId}!`);
                    }
                });
            } catch (err) { container.classList.add('hidden'); alert("Camera denied."); }
        };

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && myPlayer && !studentAnswerLocked) {
                if (channel) channel.publish('cheat_flag', { nickname: myPlayer.nickname });
                document.getElementById('lockoutOverlay').classList.remove('hidden');
            }
        });
        document.getElementById('dismissLockoutBtn').onclick = () => document.getElementById('lockoutOverlay').classList.add('hidden');
    }

    function connectStudentToAbly(nickname, avatar) {
        ably = new Ably.Realtime({ key: ABLY_API_KEY, clientId: nickname });
        channel = ably.channels.get(`room_${currentRoomId}`);

        ably.connection.on('connected', () => {
            document.getElementById('connectionStatus').innerText = '● Connected';
            document.getElementById('connectionStatus').className = 'text-xs bg-emerald-900 text-emerald-300 px-3 py-1 rounded-full border border-emerald-700';
            channel.publish('player_join', { nickname, avatar });
        });

        channel.subscribe('join_ack', (msg) => {
            if (msg.data.nickname === nickname) {
                if (msg.data.success) {
                    document.getElementById('lobbyView').classList.add('hidden');
                    document.getElementById('frozenView').classList.remove('hidden');
                    document.getElementById('frozenMessage').innerText = "Waiting for teacher...";
                } else {
                    alert('Failed: ' + msg.data.reason);
                    document.getElementById('joinLobbyBtn').innerText = 'JOIN GAME';
                }
            }
        });

        channel.subscribe('question_start', (msg) => {
            currentStudentQuestion = msg.data;
            document.getElementById('frozenView').classList.add('hidden');
            document.getElementById('lobbyView').classList.add('hidden');
            document.getElementById('gamepadView').classList.remove('hidden');
            document.getElementById('gamepadQuestionText').innerText = msg.data.text;
            studentAnswerLocked = false;
            document.getElementById('gamepadStatusText').innerText = "Tap an answer to submit";
            document.querySelectorAll('.choice-btn').forEach(btn => { btn.classList.remove('frozen'); btn.disabled = false; });
            currentStudentQuestion.localStartTime = Date.now();
        });

        channel.subscribe('question_close', () => {
            document.getElementById('gamepadView').classList.add('hidden');
            document.getElementById('frozenView').classList.remove('hidden');
            document.getElementById('frozenMessage').innerText = "Wait for the leaderboard...";
            studentAnswerLocked = true;
        });

        channel.subscribe('reveal_answer', (msg) => {
            document.getElementById('frozenMessage').innerText = `Correct Answer: ${msg.data.correct}`;
        });

        channel.subscribe('score_update', (msg) => {
            if (msg.data.nickname === myPlayer.nickname) {
                myPlayer.score = msg.data.newScore;
                document.getElementById('studentScore').innerText = myPlayer.score;
            }
        });

        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.onclick = () => {
                if (studentAnswerLocked || !currentStudentQuestion) return;
                const choice = btn.dataset.choice;
                const timeElapsed = (Date.now() - currentStudentQuestion.localStartTime) / 1000;
                studentAnswerLocked = true;
                document.querySelectorAll('.choice-btn').forEach(b => { b.classList.add('frozen'); b.disabled = true; });
                document.getElementById('gamepadStatusText').innerText = "Answer locked!";
                channel.publish('submission', { nickname: myPlayer.nickname, choice, timeElapsed, qIndex: currentStudentQuestion.index });
            };
        });
    }
</script>
</body>
</html>
