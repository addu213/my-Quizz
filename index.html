<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivia Blitz</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1e293b; color: white; margin: 0; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        .box { background: #0f172a; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; }
        button { padding: 15px; margin: 5px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; background: #3b82f6; color: white; width: 100%; font-weight: bold; }
        button:active { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .option { background: #4f46e5; margin: 10px 0; }
        .option:hover { background: #4338ca; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-family: monospace; }
        .score { font-size: 24px; color: #10b981; font-weight: bold; margin: 10px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .leaderboard { text-align: left; background: #334155; padding: 10px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

<!-- ================= TEACHER UI ================= -->
<div id="teacherApp" class="hidden box">
    <h2>Teacher Board</h2>
    <div id="qrcode" style="background:white; padding:10px; display:inline-block; margin-bottom:15px;"></div>
    <p>Room: <span id="roomCode" style="color:#10b981; font-weight:bold;"></span></p>

    <div id="setupArea">
        <textarea id="jsonInput" rows="5" placeholder='[{"q":"Capital of France?","a":"Berlin","b":"Madrid","c":"Paris","d":"Rome","ans":"c"}]'></textarea>
        <button onclick="loadQuestions()" style="background:#10b981;">Load Questions</button>
    </div>

    <div id="gameArea" class="hidden">
        <h3>Question <span id="qIndex">1</span></h3>
        <p id="qText" style="font-size: 20px; font-weight: bold;"></p>
        <p>Correct Answer: <span id="qAns" style="color:#10b981;"></span></p>
        
        <button id="btnBroadcast" onclick="broadcastQuestion()">Broadcast Question</button>
        <button id="btnReveal" onclick="revealAnswer()" disabled>Reveal Answer</button>
        <button id="btnNext" onclick="nextQuestion()" disabled>Next Question</button>
        
        <div class="leaderboard">
            <h4>Top 10 Players</h4>
            <ol id="teacherBoard"></ol>
        </div>
    </div>
</div>

<!-- ================= STUDENT UI ================= -->
<div id="studentApp" class="hidden box">
    <div id="joinArea">
        <h2>Join Trivia</h2>
        <input id="nickname" placeholder="Enter your name" style="text-align:center;">
        <button onclick="joinGame()">JOIN</button>
    </div>

    <div id="waitArea" class="hidden">
        <h2>Welcome, <span id="studentName"></span></h2>
        <p>Waiting for the teacher to start...</p>
        <div class="score">Total Score: <span id="totalScore">0</span></div>
    </div>

    <div id="questionArea" class="hidden">
        <h2 id="s_qText" style="font-size:24px;"></h2>
        <div class="grid">
            <button class="option" onclick="submitAnswer('a')" id="btnA">A</button>
            <button class="option" onclick="submitAnswer('b')" id="btnB">B</button>
            <button class="option" onclick="submitAnswer('c')" id="btnC">C</button>
            <button class="option" onclick="submitAnswer('d')" id="btnD">D</button>
        </div>
        <p id="s_status" style="color: #fbbf24; font-weight: bold;"></p>
    </div>

    <div id="resultArea" class="hidden">
        <h2 id="r_result" style="font-size: 28px;"></h2>
        <p id="r_points" style="font-size: 20px;"></p>
        <div class="score">Total Score: <span id="r_total">0</span></div>
        <p style="color:gray; margin-top:20px;">Wait for the teacher for the next question...</p>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const ABLY_KEY = 'LkHPHw.rwxAzw:d0AITZxyyJbZZQx0nxa3HXdOxK0_D1lYDgJN24dEn-U';
    let ably, channel, roomId;
    let isTeacher = false;

    // Teacher State
    let questions = [];
    let currentQ = -1;
    let players = {}; // { name: totalScore }

    // Student State
    let myName = '';
    let myTotalScore = 0;
    let questionStartTime = 0;
    let currentAnswer = '';

    // ==========================================
    // INITIALIZATION
    // ==========================================
    window.onload = () => {
        const params = new URLSearchParams(window.location.hash.substring(1));
        const role = params.get('role');
        roomId = params.get('room') || 'TRIVIA101';

        if (role === 'teacher') {
            isTeacher = true;
            document.getElementById('teacherApp').classList.remove('hidden');
            document.getElementById('roomCode').innerText = roomId;
            
            // Generate QR Code
            const joinUrl = `${window.location.origin}${window.location.pathname}#role=student&room=${roomId}`;
            new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 150, height: 150 });
            
            connectAbly('teacher');
        } else {
            document.getElementById('studentApp').classList.remove('hidden');
        }
    };

    function connectAbly(clientId) {
        ably = new Ably.Realtime({ key: ABLY_KEY, clientId: clientId });
        channel = ably.channels.get(`room_${roomId}`);

        ably.connection.on('connected', () => {
            console.log('Connected to Ably');
            
            if (isTeacher) {
                // Listen for student answers
                channel.subscribe('submit_answer', (msg) => {
                    const { name, choice, timeTaken } = msg.data;
                    
                    if (choice === currentAnswer) {
                        // Time decay: 100 base points. If > 10s, lose 5 points per second up to 50.
                        let points = 100;
                        if (timeTaken > 10) points = Math.max(50, 100 - ((timeTaken - 10) * 5));
                        
                        players[name] = (players[name] || 0) + points;
                    }
                    updateLeaderboard();
                });
            }
        });
    }

    // ==========================================
    // TEACHER LOGIC
    // ==========================================
    function loadQuestions() {
        try {
            questions = JSON.parse(document.getElementById('jsonInput').value);
            if (questions.length === 0) throw new Error("Empty");
            document.getElementById('setupArea').classList.add('hidden');
            document.getElementById('gameArea').classList.remove('hidden');
            currentQ = -1;
            nextQuestion();
        } catch (e) {
            alert("Invalid JSON format. Check your brackets and quotes.");
        }
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ >= questions.length) {
            alert("All questions finished!");
            return;
        }
        
        const q = questions[currentQ];
        currentAnswer = q.ans;
        
        document.getElementById('qIndex').innerText = currentQ + 1;
        document.getElementById('qText').innerText = q.q;
        document.getElementById('qAns').innerText = currentAnswer.toUpperCase();
        
        document.getElementById('btnBroadcast').disabled = false;
        document.getElementById('btnReveal').disabled = true;
        document.getElementById('btnNext').disabled = true;
    }

    function broadcastQuestion() {
        const q = questions[currentQ];
        document.getElementById('btnBroadcast').disabled = true;
        document.getElementById('btnReveal').disabled = false;
        
        channel.publish('show_question', {
            text: q.q,
            a: q.a, b: q.b, c: q.c, d: q.d
        });
    }

    function revealAnswer() {
        document.getElementById('btnReveal').disabled = true;
        document.getElementById('btnNext').disabled = false;
        
        channel.publish('reveal_answer', { ans: currentAnswer });
        updateLeaderboard();
    }

    function updateLeaderboard() {
        const sorted = Object.entries(players).sort((a, b) => b[1] - a[1]).slice(0, 10);
        document.getElementById('teacherBoard').innerHTML = sorted.map((p, i) => `<li>${p[0]} - ${p[1]} pts</li>`).join('');
    }

    // ==========================================
    // STUDENT LOGIC
    // ==========================================
    function joinGame() {
        myName = document.getElementById('nickname').value.trim();
        if (!myName) return alert("Enter a name");
        
        document.getElementById('joinArea').classList.add('hidden');
        document.getElementById('waitArea').classList.remove('hidden');
        document.getElementById('studentName').innerText = myName;
        
        connectAbly(myName);
        
        channel.subscribe('show_question', (msg) => {
            const q = msg.data;
            document.getElementById('waitArea').classList.add('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('questionArea').classList.remove('hidden');
            
            document.getElementById('s_qText').innerText = q.text;
            document.getElementById('btnA').innerText = "A) " + q.a;
            document.getElementById('btnB').innerText = "B) " + q.b;
            document.getElementById('btnC').innerText = "C) " + q.c;
            document.getElementById('btnD').innerText = "D) " + q.d;
            
            // Reset buttons
            document.querySelectorAll('.option').forEach(b => b.disabled = false);
            document.getElementById('s_status').innerText = "";
            questionStartTime = Date.now();
        });

        channel.subscribe('reveal_answer', (msg) => {
            const correctAns = msg.data.ans;
            document.getElementById('questionArea').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');
            
            if (currentAnswer === '') {
                document.getElementById('r_result').innerText = "Too slow!";
                document.getElementById('r_points').innerText = "You didn't answer.";
                document.getElementById('r_result').style.color = "#ef4444";
            } else if (currentAnswer === correctAns) {
                document.getElementById('r_result').innerText = "Correct!";
                document.getElementById('r_result').style.color = "#10b981";
                document.getElementById('r_points').innerText = `+${lastPoints} points`;
            } else {
                document.getElementById('r_result').innerText = "Wrong!";
                document.getElementById('r_result').style.color = "#ef4444";
                document.getElementById('r_points').innerText = "0 points";
            }
            document.getElementById('r_total').innerText = myTotalScore;
        });
    }

    let lastPoints = 0;

    function submitAnswer(choice) {
        if (currentAnswer !== '') return; 
        currentAnswer = choice;
        
        document.querySelectorAll('.option').forEach(b => b.disabled = true);
        document.getElementById('s_status').innerText = "Answer locked in!";
        
        const timeTaken = (Date.now() - questionStartTime) / 1000;
        
        // Student calculates their own points for the visual scoreboard
        // We don't know if it's correct yet, so we just calculate the base time-decay points
        // If correct, teacher adds to leaderboard. 
        lastPoints = 100;
        if (timeTaken > 10) lastPoints = Math.max(50, 100 - ((timeTaken - 10) * 5));
        
        // Wait, the student only gets points if they are right. 
        // We'll send the answer to the teacher. The teacher validates and updates.
        // But for the student's own screen, we need to know their total.
        // For simplicity, let's just trust the teacher to send back a personal score, OR we calculate it.
        
        channel.publish('submit_answer', {
            name: myName,
            choice: choice,
            timeTaken: timeTaken
        });
        
        // To keep student total synced:
        // We need the correct answer to know if we add points. 
        // We will calculate total upon reveal.
    }
</script>
</body>
</html>
