<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trivia Blitz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<style>
body{-webkit-tap-highlight-color:transparent;}.gamepad-btn:active{transform:scale(0.95);}.frozen{opacity:0.4;pointer-events:none;filter:grayscale(1);}.lockout-overlay{background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);}.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0.5rem;max-height:40vh;overflow-y:auto;}.avatar-option{font-size:2rem;cursor:pointer;padding:0.25rem;border-radius:0.5rem;text-align:center;}.avatar-option.selected{background:#4f46e5;box-shadow:0 0 0 3px #818cf8;}.scrollbar-hide::-webkit-scrollbar{display:none;}.json-box{font-family:monospace;font-size:12px;width:100%;height:90px;}.correct-glow{background-color:#059669!important;border-color:#34d399!important;transform:scale(1.02);box-shadow:0 0 20px rgba(52,211,153,0.5);}
</style>
</head>
<body class="bg-slate-900 font-sans antialiased text-slate-100 h-screen overflow-hidden flex flex-col">
<div id="teacherApp" class="hidden h-full flex flex-col bg-slate-800">
<header class="bg-slate-950 border-b border-slate-700 px-4 py-3 flex flex-wrap items-center justify-between shadow-lg shrink-0">
<div class="flex items-center gap-3"><span class="text-2xl">📋</span><h1 class="text-xl font-bold tracking-tight">Teacher Board</h1><span id="roomBadge" class="bg-indigo-600 text-xs font-mono px-3 py-1 rounded-full">ROOM: ——</span></div>
<div class="flex items-center gap-4 text-sm"><span id="playerCount" class="bg-slate-700 px-3 py-1 rounded-full font-mono">👥 0 / 200</span><button id="resetBoardBtn" class="bg-rose-700 hover:bg-rose-600 px-3 py-1 rounded-lg transition">Reset Game</button></div>
</header>
<div class="flex-1 relative overflow-hidden">
<div id="setupView" class="absolute inset-0 p-4 grid grid-cols-1 lg:grid-cols-12 gap-4 overflow-y-auto">
<div class="lg:col-span-4 bg-slate-900 rounded-2xl p-4 flex flex-col shadow-xl border border-slate-700">
<h2 class="text-sm uppercase tracking-wider text-slate-400 mb-2 font-bold">Scan to join</h2>
<div id="qrcodeContainer" class="bg-white p-3 rounded-2xl self-center shadow-inner mb-4"></div>
<label class="text-xs text-indigo-400 font-bold block mb-1">Saved Deck Name</label>
<input id="deckNameInput" type="text" class="bg-slate-800 border border-slate-600 rounded-lg p-2 text-sm w-full outline-none mb-2 text-indigo-200" placeholder="e.g. Class 1 Quiz">
<label class="text-xs text-indigo-400 font-bold block mb-1">Load Deck (JSON)</label>
<textarea id="jsonInput" class="bg-slate-800 border border-slate-600 rounded-lg p-2 json-box text-slate-300 outline-none mb-2" placeholder='[{"q":"Question?","a":"A","b":"B","c":"C","d":"D","correct":"A"}]'></textarea>
<button id="saveDeckBtn" class="w-full bg-emerald-700 hover:bg-emerald-600 py-2 rounded-lg text-xs font-bold transition mb-2">Save & Load Deck</button>
<div id="deckStatus" class="text-xs text-center text-slate-400 mb-4">No deck loaded.</div>
<button id="loadNextBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition shadow-lg mt-auto">Load Question ▶</button>
</div>
<div class="lg:col-span-8 bg-slate-900 rounded-2xl p-6 shadow-xl border border-slate-700 flex flex-col">
<h2 class="font-semibold text-xl mb-4">📌 Question Editor (Hidden from Projector)</h2>
<textarea id="questionText" rows="3" class="w-full bg-slate-800 border border-slate-600 rounded-xl p-3 text-lg outline-none mb-4" placeholder="Enter question...">What is the capital of France?</textarea>
<div class="grid grid-cols-2 gap-3 mb-4">
<div class="flex bg-slate-800 rounded-lg border border-slate-600 p-3"><span class="font-bold text-indigo-400 mr-3 text-lg">A</span><input id="choiceA" class="bg-transparent w-full outline-none text-lg" value="Berlin"></div>
<div class="flex bg-slate-800 rounded-lg border border-slate-600 p-3"><span class="font-bold text-indigo-400 mr-3 text-lg">B</span><input id="choiceB" class="bg-transparent w-full outline-none text-lg" value="Madrid"></div>
<div class="flex bg-slate-800 rounded-lg border border-slate-600 p-3"><span class="font-bold text-indigo-400 mr-3 text-lg">C</span><input id="choiceC" class="bg-transparent w-full outline-none text-lg" value="Paris"></div>
<div class="flex bg-slate-800 rounded-lg border border-slate-600 p-3"><span class="font-bold text-indigo-400 mr-3 text-lg">D</span><input id="choiceD" class="bg-transparent w-full outline-none text-lg" value="Rome"></div>
</div>
<div class="flex gap-4 items-center bg-slate-800 p-4 rounded-xl border border-slate-600 text-lg mb-6">
<label class="text-slate-400">Correct:</label>
<select id="correctChoiceSelect" class="bg-slate-700 rounded p-2 outline-none font-bold text-white"><option value="A">A</option><option value="B">B</option><option value="C" selected>C</option><option value="D">D</option></select>
<label class="text-slate-400 ml-4">Time(s):</label><input id="durationInput" type="number" value="20" class="w-20 bg-slate-700 rounded p-2 text-center">
<label class="text-slate-400 ml-4">Base Pts:</label><input id="baseMarksInput" type="number" value="100" class="w-20 bg-slate-700 rounded p-2 text-center">
<label class="text-slate-400 ml-4">Penalty:</label><input id="penaltyInput" type="number" value="50" class="w-20 bg-slate-700 rounded p-2 text-center">
</div>
<button id="broadcastBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-5 rounded-xl font-bold text-xl transition shadow-lg shadow-indigo-900/50 mt-auto">▶ PROJECT TO CLASS</button>
</div>
</div>
